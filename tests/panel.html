<!doctype html>
<html><head><meta charset="utf-8"><title>history-explorer-card info panel tests</title></head>
<body style="width:900px;margin:0"><style>ha-card{display:block}</style><div id=host></div>
<!-- The card's info panel: the history section of Home Assistant's entity dialog
     (ha-more-info-history, faked here: it renders what the card puts in its place),
     against the mocked Home Assistant (mock-ha.js). The panel's config comes from the test
     (window.PANEL_CFG; null: the panel off, nothing saved in this browser); window.LOAD_TWICE
     loads the card's file a second time, from another URL. -->
<script src="mock-ha.js"></script>
<script>
if( window.PANEL_CFG !== null ) localStorage.setItem('history-explorer-info-panel', JSON.stringify({ config: window.PANEL_CFG || {} }));
else localStorage.removeItem('history-explorer-info-panel');
// lit's template result, rendered to HTML text
const ser=(t)=>{ if(t==null||t===false) return ''; if(typeof t!=='object') return String(t); if(Array.isArray(t)) return t.map(ser).join(''); let o=''; t.strings.forEach((x,k)=>{ o+=x; if(k<t.values.length) o+=ser(t.values[k]); }); return o; };
class FakeMoreInfoHistory extends HTMLElement {
  constructor(){ super(); this.attachShadow({mode:'open'}); }
  render(){ return {_$litType$:1,strings:['<div>native</div>'],values:[]}; }
  updated(){}
  requestUpdate(){ this.shadowRoot.innerHTML=ser(this.render()); this._rendered=true; this.updated(new Map()); }
  // A new hass, as Home Assistant pushes it: lit calls updated() again — the rendered markup
  // doesn't change (same template), so it isn't rendered again here
  get hass(){ return this._hass; }
  set hass(v){ const old=this._hass; this._hass=v; if( this._rendered ) this.updated(new Map([['hass', old]])); }
}
customElements.define('ha-more-info-history', FakeMoreInfoHistory);
</script>
<script src="../history-explorer-card.js"></script>
<script>if( window.LOAD_TWICE ) document.write('<script src="../history-explorer-card.js?again"><\/script>');</script>
<script>
// Opens the entity dialog's history of entity eid
window.openPanel=(eid)=>{ const p=document.createElement('ha-more-info-history'); p.entityId=eid; p.hass=mkHass(); document.getElementById('host').appendChild(p); p.requestUpdate(); window.P=p; window.hassTargets=[p]; return true; };
window.inst=()=>window.P.hec_instance;
window.datasets=(gi)=>inst().graphs[gi].chart.data.datasets.map(d=>({ label:d.label, n:d.data.length, circular:d.hecCircular, type:d.type }));
window.timeRange=()=>[inst().startTime,inst().endTime];
</script></body></html>
