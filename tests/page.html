<!doctype html>
<html><head><meta charset="utf-8"><title>history-explorer-card tests</title></head>
<body style="width:1000px;margin:0"><style>ha-card{display:block}</style><div id=host></div>
<!-- A mock of the few Home Assistant APIs the card uses: states, history (one value per
     entity), user data (stored by the test, see lib.cjs). The card under test is the built
     history-explorer-card.js; the config comes from the test (window.CFG). -->
<script>
window.logs=[]; window.onerror=(m)=>{logs.push('ERR '+m)};
const _ce=console.error; console.error=(...a)=>{logs.push('CE '+a.join(' '));_ce(...a)};
const lc=new Date(Date.now()-3600e3).toISOString();
const ent=(id,name,unit,val,sc)=>({entity_id:id,state:val,last_changed:lc,last_updated:lc,attributes:Object.assign({friendly_name:name},unit?{unit_of_measurement:unit}:{},sc?{state_class:sc}:{})});
const STATES={
 'sensor.watering_cycle':ent('sensor.watering_cycle','cycle','d','3','measurement'),
 'sensor.days_to_watering':ent('sensor.days_to_watering','days to','d','2','measurement'),
 'input_number.watering_in_progress':ent('input_number.watering_in_progress','in progress',null,'1'),
 'sensor.rain':ent('sensor.rain','rain','mm','4','measurement'),
 'sensor.power':ent('sensor.power','power','W','400','measurement'),
 'binary_sensor.a':ent('binary_sensor.a','door a',null,'on'),
 'binary_sensor.b':ent('binary_sensor.b','door b',null,'off'),
 'sensor.power_kw':ent('sensor.power_kw','power kw','kW','1.2','measurement'),
 'sensor.energy':ent('sensor.energy','energy','kWh','12','total_increasing'),
 'sensor.power2':ent('sensor.power2','power two','W','300','measurement'),
 'sensor.energy2':ent('sensor.energy2','energy2','kWh','5','total_increasing'),
};
window.userData={};
function mkHass(){ return {
  states:STATES, config:{version:'2026.7.4'}, language:'en', locale:{language:'en'}, themes:{darkMode:false}, selectedTheme:null,
  user:{id:'u1',name:'u'}, localize:(k)=>k,
  callWS:(d)=>{
    if(d.type==='history/history_during_period'){ const t0=Date.parse(d.start_time)/1000; const r={}; for(const e of d.entity_ids) r[e]=[{s:STATES[e].state,lu:t0}]; return Promise.resolve(r); }
    if(d.type==='frontend/get_user_data') return window.__getUD(d.key).then(v=>({value:v}));
    if(d.type==='frontend/set_user_data'){ return window.__setUD(d.key, d.value===null?null:JSON.parse(JSON.stringify(d.value))).then(()=>({})); }
    return Promise.resolve({}); } }; }
</script>
<script src="../history-explorer-card.js"></script>
<script>
const el=document.createElement('history-explorer-card');
el.setConfig(window.CFG);
document.getElementById('host').appendChild(el);
el.hass=mkHass();
window.el=el;
</script>
<script>
// Probes used by the tests: client coordinates of the things to press, and a compact view
// of the card's state. (They read the charts' layout, which the card itself never does.)
const graphAt=(gi)=>el.instance._allGraphsInDisplayOrder()[gi];
window.state=()=>{ const I=el.instance; return JSON.stringify({range:[I.activeRange.timeRangeHours,I.activeRange.timeRangeMinutes], graphs:I._allGraphsInDisplayOrder().map(g=>g.type[0]+':'+g.entities.map(e=>e.entity.split('.')[1]+(e.type==='bar'?'[B]':'')+(e.hidden?'(h)':'')).join('+')+(g.entities[0].graphKey?'[k]':'')+(g.groupId!=null?'@'+g.groupId:'')), colors:Object.fromEntries(I.graphs.flatMap(g=>g.entities.map(e=>[e.entity.split('.')[1],e.color])))}); };
window.legendPt=(gi,di)=>{ const g=graphAt(gi); const b=g.chart.legend.legendHitBoxes[di]; const r=g.canvas.getBoundingClientRect(); return {x:r.left+b.left+(b.width/2), y:r.top+b.top+b.height/2}; };
window.tlPt=(gi,li)=>{ const g=graphAt(gi); const y=g.chart.scales['y-axis-0'].getPixelForValue(null,li,li); const r=g.canvas.getBoundingClientRect(); return {x:r.left+20,y:r.top+y}; };
window.graphPtAt=(gi,frac)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height*frac}; };
window.chainPt=(gi)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); const m=g.chart._hecLinkMarkerRect(); return m?{x:r.left+m.left+m.width/2,y:r.top+m.top+m.height/2}:null; };
window.moPt=(gi)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); return {x:r.left+6,y:r.top+14}; };
window.lockOf=(gi)=>graphAt(gi).chart._hecYAxisLock||0;
window.lockPt=(gi)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); return {x:r.left+24,y:r.top+14}; };
window.yaPt=(gi,frac)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); const a=g.chart.chartArea; return {x:r.left+a.left/2,y:r.top+a.top+(a.bottom-a.top)*(frac??0.5)}; };
window.yRange=(gi)=>{ const s=graphAt(gi).chart.scales['y-axis-0']; return [+s.min.toFixed(2),+s.max.toFixed(2)]; };
window.timeRange=()=>[el.instance.startTime,el.instance.endTime];
window.chainShown=()=>el.instance._allGraphsInDisplayOrder().map(g=>g.chart.options.linkMarkerVisible?1:0).join('');
// The persisted list agrees with the screen: each group's entries contiguous, groups in
// the order their graphs are shown, every shown entity persisted once — '' when so, else
// what's wrong
window.storeProblems=()=>{ const I=el.instance; const list=I.store.list.filter(e=>typeof e==='object');
  const seq=[]; for(const e of list){ if(seq[seq.length-1]!==e.groupId) seq.push(e.groupId); }
  if(new Set(seq).size!==seq.length) return 'group split in the list: '+seq.join(',');
  const shown=[]; for(const g of I._allGraphsInDisplayOrder()){ if(shown[shown.length-1]!==g.groupId) shown.push(g.groupId); }
  const listShown=seq.filter(id=>shown.includes(id));
  if(listShown.join()!==shown.join()) return 'list order '+listShown.join(',')+' vs shown '+shown.join(',');
  const ids=I.graphs.flatMap(g=>g.entities.map(e=>e.entity)); const dup=ids.find(id=>list.filter(e=>e.entity===id).length!==1);
  return dup?'not persisted once: '+dup:''; };
window.tip=()=>{ const t=el.querySelector('#hec-label-tooltip')||document.getElementById('hec-label-tooltip'); return t?t.textContent:null; };
window.menuOpen=()=>{ const m=el.querySelector('#et_0'); return m? getComputedStyle(m).display!=='none' && m.style.display!=='none' : null; };
</script></body></html>
