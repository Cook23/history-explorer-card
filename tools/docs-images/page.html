<!doctype html>
<html><head><meta charset="utf-8"><title>docs</title>
<style>
:root{--primary-text-color:#212121;--secondary-text-color:#727272;--card-background-color:#fff;--primary-background-color:#fafafa;
 --divider-color:rgba(0,0,0,.12);--primary-color:#03a9f4;--success-color:#4caf50;--error-color:#db4437;--state-icon-color:#44739e;
 --ha-card-border-radius:12px;font-family:Roboto,"Segoe UI",Arial,sans-serif}
body{margin:0;background:var(--primary-background-color);color:var(--primary-text-color);padding:16px}
ha-card{display:block;background:var(--card-background-color);border-radius:12px;border:1px solid #e0e0e0;overflow:visible}
#host{width:var(--w,900px)}
</style></head>
<body><div id=host></div>
<script src="../../tests/mock-ha.js"></script>
<script>for( const k in STATES ) delete STATES[k]; Object.assign(STATES, window.DOCS_STATES||{});
// Home Assistant's own state names (its frontend's translations), for the entities of the docs
const LOC={'binary_sensor.entity_component.door.state.off':'Closed','binary_sensor.entity_component.door.state.on':'Open',
 'binary_sensor.entity_component.motion.state.off':'Clear','binary_sensor.entity_component.motion.state.on':'Detected',
 'binary_sensor.entity_component.lock.state.off':'Locked','binary_sensor.entity_component.lock.state.on':'Unlocked',
 'person.entity_component._.state.home':'Home','person.entity_component._.state.not_home':'Away',
 'binary_sensor.entity_component._.state.on':'On','binary_sensor.entity_component._.state.off':'Off',
 'lock.entity_component._.state.locked':'Locked','lock.entity_component._.state.unlocked':'Unlocked'};
// The statistics of a total from its history (the docs' rows): its state at a time
const _va=valueAt; valueAt=(id,t)=>{ const R=(window.MOCK.rows||{})[id]; if( !R ) return _va(id,t);
  const now=Date.now()/1000; let v=null, best=-Infinity; for( const [ago,s] of R ){ const lu=now-ago; if( lu<=t && lu>best ){ best=lu; v=s; } } return v ?? R[0][1]; };
const _mk=mkHass; mkHass=()=>{ const h=_mk(); h.localize=k=>LOC[k.replace(/^component\./,'')]||''; return h; };
// Home Assistant's ha-card: its header attribute shown above its content
customElements.define('ha-card', class extends HTMLElement {
  static get observedAttributes(){ return ['header']; }
  constructor(){ super(); this.attachShadow({mode:'open'}).innerHTML='<style>.h{font-size:24px;line-height:32px;padding:20px 16px 12px;color:var(--primary-text-color)}.h:empty{display:none}</style><div class=h></div><slot></slot>'; }
  attributeChangedCallback(n,o,v){ this.shadowRoot.querySelector('.h').textContent=v||''; }
});
</script>
<script src="../../history-explorer-card.js"></script>
<script>
const el=document.createElement('history-explorer-card');
el.setConfig(window.CFG);
document.getElementById('host').appendChild(el);
el.hass=mkHass();
window.el=el;
window.hassTargets=[el];
</script>
<script>
// Probes used by the tests: client coordinates of the things to press, and a compact view
// of the card's state. (They read the charts' layout, which the card itself never does.)
const graphAt=(gi)=>el.instance.graphsInDisplayOrder()[gi];
window.state=()=>{ const I=el.instance; return JSON.stringify({range:[I.activeRange.timeRangeHours,I.activeRange.timeRangeMinutes], graphs:I.graphsInDisplayOrder().map(g=>g.type[0]+':'+g.entities.map(e=>e.entity.split('.')[1]+(e.type==='bar'?'[B]':'')+(e.hidden?'(h)':'')).join('+')+(g.entities[0].graphKey?'[k]':'')+(g.groupId!=null?'@'+g.groupId:'')), colors:Object.fromEntries(I.graphs.flatMap(g=>g.entities.map(e=>[e.entity.split('.')[1],e.color])))}); };
window.legendPt=(gi,di)=>{ const g=graphAt(gi); const b=g.chart.legend.legendHitBoxes[di]; const r=g.canvas.getBoundingClientRect(); return {x:r.left+b.left+(b.width/2), y:r.top+b.top+b.height/2}; };
// (a timeline's row label: near its right end, clear of the floating handle at the top left)
window.tlPt=(gi,li)=>{ const g=graphAt(gi); const y=g.chart.scales['y-axis-0'].getPixelForValue(null,li,li); const r=g.canvas.getBoundingClientRect(); return {x:r.left+g.chart.chartArea.left-20,y:r.top+y}; };
// Client position of the point drawn within the plot area at fraction frac of graph gi's first dataset
window.pointPt=(gi,frac)=>{ const c=graphAt(gi).chart; const A=c.chartArea; const d=c.getDatasetMeta(0).data.filter(p=>!p._view.skip && p._view.x>A.left && p._view.x<A.right && p._view.y>A.top && p._view.y<A.bottom); const v=d[Math.floor(d.length*frac)]._view; const r=c.canvas.getBoundingClientRect(); return {x:r.left+v.x, y:r.top+v.y}; };
window.graphPtAt=(gi,frac)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height*frac}; };
window.chainPt=(gi)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); const m=g.chart._hecLinkMarkerRect(); return m?{x:r.left+m.left+m.width/2,y:r.top+m.top+m.height/2}:null; };
window.moPt=(gi)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); return {x:r.left+6,y:r.top+14}; };
window.lockOf=(gi)=>graphAt(gi).chart._hecYAxisLock||0;
window.lockPt=(gi)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); return {x:r.left+24,y:r.top+14}; };
window.yaPt=(gi,frac)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); const a=g.chart.chartArea; return {x:r.left+a.left/2,y:r.top+a.top+(a.bottom-a.top)*(frac??0.5)}; };
window.yRange=(gi)=>{ const s=graphAt(gi).chart.scales['y-axis-0']; return [+s.min.toFixed(2),+s.max.toFixed(2)]; };
// The right Y axis: a point in its label column, its range
window.yaRightPt=(gi,frac)=>{ const g=graphAt(gi); const r=g.canvas.getBoundingClientRect(); const a=g.chart.chartArea; return {x:r.left+(a.right+g.chart.width)/2,y:r.top+a.top+(a.bottom-a.top)*(frac??0.5)}; };
window.yRangeRight=(gi)=>{ const s=graphAt(gi).chart.scales['y-axis-1']; return [+s.min.toFixed(2),+s.max.toFixed(2)]; };
window.timeRange=()=>[el.instance.startTime,el.instance.endTime];
window.chainShown=()=>el.instance.graphsInDisplayOrder().map(g=>g.chart.options.linkMarkerVisible?1:0).join('');
// The persisted list agrees with the screen: each group's entries contiguous, groups in
// the order their graphs are shown, every shown entity persisted once — '' when so, else
// what's wrong
window.storeProblems=()=>{ const I=el.instance; const list=I.store.list.filter(e=>typeof e==='object');
  const seq=[]; for(const e of list){ if(seq[seq.length-1]!==e.groupId) seq.push(e.groupId); }
  if(new Set(seq).size!==seq.length) return 'group split in the list: '+seq.join(',');
  const shown=[]; for(const g of I.graphsInDisplayOrder()){ if(shown[shown.length-1]!==g.groupId) shown.push(g.groupId); }
  const listShown=seq.filter(id=>shown.includes(id));
  if(listShown.join()!==shown.join()) return 'list order '+listShown.join(',')+' vs shown '+shown.join(',');
  const ids=I.graphs.flatMap(g=>g.entities.map(e=>e.entity)); const dup=ids.find(id=>list.filter(e=>e.entity===id).length!==1);
  return dup?'not persisted once: '+dup:''; };
// What each dataset of graph gi holds: its label, point count, first and last time (ms)
window.datasets=(gi)=>graphAt(gi).chart.data.datasets.map(d=>{ const xs=d.data.map(p=>p&&(p.x??p[0])).filter(x=>x!=null).map(x=>+new Date(x));
  return { label:legendText(d), n:d.data.length, x0:xs.length?Math.min(...xs):null, x1:xs.length?Math.max(...xs):null }; });
// The next file the card saves (FileSaver's saveAs), as text
window.captureSave=()=>{ window.__saved=null; window.saveAs=(blob,name)=>blob.text().then(t=>{ window.__saved={name,text:t}; }); };
// A legend label as shown: its name, then its value and its mark (a legend item, or the dataset it comes from)
window.legendText=o=>{ const v=o.hecValue??o.hecLegendValue, m=o.hecMark??o.hecLegendMark; return (o.text??o.label)+(v?' '+v:'')+(m?' '+m:''); };
// The text shown in full in place of a shortened one (Chart.hecUi.reveal): its text while shown, else null
window.reveal=()=>{ const t=document.getElementById('hec-reveal'); return t&&t.isConnected&&getComputedStyle(t).opacity!=='0'?t.textContent:null; };
window.tip=()=>{ const t=el.querySelector('#hec-label-tooltip')||document.getElementById('hec-label-tooltip'); return t?t.textContent:null; };
window.menuOpen=()=>{ const m=el.querySelector('#et_0'); return m? getComputedStyle(m).display!=='none' && m.style.display!=='none' : null; };
</script></body></html>
